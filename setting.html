<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLU - Account Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-canvas: #F4F7FC; --obsidian: #0A1128; --cyan-glow: #00E5FF;
            --gold-lux: #C5A059; --text-main: #0F172A; --text-muted: #64748B;
            --success: #059669; --warning: #D97706; --danger: #DC2626;
            --electric-blue: #2D63ED; --fresh-teal: #0EA5E9; 
            --border-light: #E2E8F0;
        }
        
        body { 
            margin: 0; padding: 0; background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.06), transparent 40%),
                linear-gradient(rgba(10, 17, 40, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 17, 40, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Montserrat', sans-serif; color: var(--text-main);
            padding-bottom: 120px; overflow-x: hidden; position: relative; -webkit-tap-highlight-color: transparent;
        }
        
        * { box-sizing: border-box; outline: none; text-decoration: none; }

        .bg-watermark { position: fixed; bottom: -10%; right: -25%; height: 100vh; opacity: 0.08; transform: scale(1.1) rotate(-15deg); z-index: -1; pointer-events: none; user-select: none; }

        .profile-header { padding: 40px 20px 100px; text-align: center; position: relative; z-index: 10;}
        .header-title { font-size: 28px; font-weight: 900; color: var(--obsidian); text-transform: uppercase; letter-spacing: -1px; }
        
        .avatar-container { position: relative; width: 120px; height: 120px; margin: -60px auto 30px; z-index: 10; }
        .avatar-img { width: 100%; height: 100%; border-radius: 35px; object-fit: cover; background: var(--bg-canvas); border: 4px solid white; box-shadow: 0 15px 35px rgba(10,17,40,0.1); }
        .btn-edit-photo { position: absolute; bottom: -5px; right: -5px; width: 40px; height: 40px; border-radius: 50%; background: var(--obsidian); color: var(--gold-lux); border: 3px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(10,17,40,0.2);}
        #fileInput { display: none; }
        
        .form-wrapper { padding: 0 25px; position: relative; z-index: 10;}
        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; margin-left: 5px; letter-spacing: 0.5px;}
        .input-box { position: relative; }
        .input-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--obsidian); font-size: 16px; z-index: 2;}
        .form-control { width: 100%; padding: 16px 16px 16px 50px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border: 1px solid white; border-radius: 18px; font-family: 'Montserrat'; font-weight: 600; font-size: 14px; position: relative; appearance: none; -webkit-appearance: none; color: var(--text-main); box-shadow: 0 5px 15px rgba(10,17,40,0.02); transition: 0.3s;}
        .form-control:focus { border-color: var(--gold-lux); box-shadow: 0 5px 20px rgba(197, 160, 89, 0.15); background: white;}
        .form-control:disabled { background: #F1F5F9; color: var(--text-muted); border-color: #E2E8F0; box-shadow: none;}
        
        .btn-save { width: 100%; padding: 18px; margin-top: 10px; background: var(--obsidian); color: var(--gold-lux); border: none; border-radius: 18px; font-family: 'Montserrat'; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 10px 30px rgba(10,17,40,0.2); transition: 0.2s;}
        .btn-save:active { transform: scale(0.98); }
        .btn-logout { width: 100%; padding: 18px; margin-top: 15px; background: transparent; color: var(--danger-glow); border: 2px dashed rgba(225, 29, 72, 0.4); border-radius: 18px; font-family: 'Montserrat'; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;}
        .btn-logout:active { background: rgba(225, 29, 72, 0.1); }
        
        .dock-container { position: fixed; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .nav-pill { background: rgba(10, 17, 40, 0.95); backdrop-filter: blur(15px); padding: 12px 30px; border-radius: 50px; display: flex; gap: 40px; border: 1px solid rgba(197, 160, 89, 0.3); box-shadow: 0 15px 30px rgba(10,17,40,0.3);}
        .nav-tab { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #64748B; transition: 0.2s;}
        .nav-tab.active { color: var(--gold-lux); transform: translateY(-3px);}
        
        .overlay { position: fixed; inset: 0; background: rgba(10,17,40,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: rgba(255,255,255,0.95); padding: 30px; border-radius: 30px; text-align: center; width: 90%; max-width: 300px; box-shadow: 0 30px 80px rgba(0,0,0,0.2); border: 1px solid white;}
    </style>
</head>
<body>

    <img src="logomlumaster.png" class="bg-watermark" alt="" onerror="this.style.display='none'">

    <div class="overlay" id="statusOverlay">
        <div class="modal-box">
            <i class="fas fa-spinner fa-spin" id="statusIcon" style="font-size:40px; color:var(--obsidian); margin-bottom:15px;"></i>
            <div id="statusText" style="font-family:'Montserrat'; font-weight:900; color:var(--obsidian);">Menyimpan...</div>
        </div>
    </div>

    <header class="profile-header"><div class="header-title">Pengaturan Akun</div></header>

    <div class="avatar-container">
        <img id="profileImg" src="" class="avatar-img">
        <label for="fileInput" class="btn-edit-photo"><i class="fas fa-camera"></i></label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="form-wrapper">
        <div class="input-group"><label class="input-label">Plat Nomor</label><div class="input-box"><i class="fas fa-motorcycle"></i><input type="text" id="inpPlat" class="form-control" disabled></div></div>
        <div class="input-group"><label class="input-label">Nama Legal (KTP)</label><div class="input-box"><i class="fas fa-id-card"></i><input type="text" id="inpKtp" class="form-control" style="text-transform:uppercase;"></div></div>
        <div class="input-group"><label class="input-label">Nama Panggilan (WA)</label><div class="input-box"><i class="fas fa-user"></i><input type="text" id="inpWa" class="form-control" style="text-transform:uppercase;"></div></div>
        <div class="input-group"><label class="input-label">Nomor WhatsApp Pribadi</label><div class="input-box"><i class="fab fa-whatsapp"></i><input type="tel" id="inpHp" class="form-control"></div></div>
        
        <div class="input-group" style="background:rgba(225, 29, 72, 0.05); border:1px dashed var(--danger-glow); padding:20px 15px; border-radius:20px; margin-top:25px;">
            <div style="font-size:10px; font-weight:800; color:var(--danger-glow); margin-bottom:15px; text-align:center;"><i class="fas fa-heartbeat"></i> KONTAK DARURAT (WAJIB)</div>
            
            <label class="input-label">No. HP Darurat</label>
            <div class="input-box" style="margin-bottom:15px;"><i class="fas fa-phone-alt" style="color:var(--danger-glow);"></i><input type="tel" id="inpDarurat" class="form-control" placeholder="Cth: 0812345678..."></div>
            
            <label class="input-label">Hubungan</label>
            <div class="input-box">
                <i class="fas fa-users" style="color:var(--danger-glow);"></i>
                <select id="inpHubungan" class="form-control">
                    <option value="">-- Pilih Hubungan --</option>
                    <option value="ISTRI">Istri</option>
                    <option value="SUAMI">Suami</option>
                    <option value="ORANG TUA">Orang Tua</option>
                    <option value="ANAK">Anak</option>
                    <option value="SAUDARA">Saudara / Kakak / Adik</option>
                    <option value="LAINNYA">Lainnya</option>
                </select>
            </div>
        </div>
        
        <div class="input-group" style="margin-top:25px;"><label class="input-label">Ubah PIN Keamanan (Opsional)</label><div class="input-box"><i class="fas fa-lock"></i><input type="password" id="inpPin" class="form-control" placeholder="Kosongkan jika tidak diganti"></div></div>

        <button class="btn-save" onclick="saveProfile()"><i class="fas fa-save"></i> SIMPAN PERUBAHAN</button>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> KELUAR DARI SISTEM</button>
    </div>

    <div class="dock-container">
        <nav class="nav-pill">
            <a href="dashboard.html" class="nav-tab"><i class="fas fa-home"></i></a>
            <a href="data_anggota.html" class="nav-tab"><i class="fas fa-address-book"></i></a>
            <a href="setting.html" class="nav-tab active"><i class="fas fa-user-cog"></i></a>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAk3G5aQUBVe_g7_peVu1F6xllP_RejGq0", authDomain: "rtomaka-e67b5.firebaseapp.com", projectId: "rtomaka-e67b5", storageBucket: "rtomaka-e67b5.firebasestorage.app", messagingSenderId: "472036722228", appId: "1:472036722228:web:11d520f9204db317d02c61" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let uData = JSON.parse(localStorage.getItem('maka_user'));
        if (!uData) window.location.href = 'index.html';

        document.getElementById('inpPlat').value = uData.plat;
        document.getElementById('inpKtp').value = uData.namaKtp || uData.nama || "";
        document.getElementById('inpWa').value = uData.namaWa || uData.nama || "";
        document.getElementById('inpHp').value = uData.hp || "";
        
        // Injeksi data darurat ke input form
        document.getElementById('inpDarurat').value = uData.darurat || "";
        document.getElementById('inpHubungan').value = uData.hubungan || "";
        
        let currentPhotoBase64 = uData.foto || `https://ui-avatars.com/api/?background=C5A059&color=0A1128&bold=true&size=200&name=${encodeURIComponent(uData.nama)}`;
        document.getElementById('profileImg').src = currentPhotoBase64;

        // Image Compressor
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    let w = img.width; let h = img.height;
                    if (w > h) { if (w > 400) { h *= 400/w; w = 400; } } else { if (h > 400) { w *= 400/h; h = 400; } }
                    canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('profileImg').src = currentPhotoBase64;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        window.saveProfile = async () => {
            document.getElementById('statusOverlay').style.display = 'flex';
            const newKtp = document.getElementById('inpKtp').value.trim().toUpperCase();
            const newWa = document.getElementById('inpWa').value.trim().toUpperCase();
            const newHp = document.getElementById('inpHp').value.trim();
            const newPin = document.getElementById('inpPin').value.trim();
            
            // Tangkap data darurat baru
            const newDarurat = document.getElementById('inpDarurat').value.trim();
            const newHubungan = document.getElementById('inpHubungan').value;

            if (!newKtp || !newWa) {
                document.getElementById('statusOverlay').style.display = 'none';
                return alert("Nama KTP dan Nama WA wajib diisi!");
            }

            try {
                let updatePayload = {
                    namaKtp: newKtp, namaWa: newWa, nama: newWa, hp: newHp, foto: currentPhotoBase64,
                    darurat: newDarurat, hubungan: newHubungan
                };
                
                if (newPin !== "") updatePayload.pin = newPin;

                await updateDoc(doc(db, "mlu_members", uData.id), updatePayload);

                // Update Local Memori
                uData.namaKtp = newKtp; uData.namaWa = newWa; uData.nama = newWa; uData.hp = newHp; uData.foto = currentPhotoBase64;
                uData.darurat = newDarurat; uData.hubungan = newHubungan;
                localStorage.setItem('maka_user', JSON.stringify(uData));

                document.getElementById('statusIcon').className = 'fas fa-check-circle';
                document.getElementById('statusIcon').style.color = 'var(--success-glow)';
                document.getElementById('statusText').innerText = 'Berhasil Disimpan!';
                setTimeout(() => { document.getElementById('statusOverlay').style.display = 'none'; location.reload(); }, 1500);

            } catch (e) {
                alert("Gagal sinkronisasi ke server: " + e.message);
                document.getElementById('statusOverlay').style.display = 'none';
            }
        };

        window.logout = () => { if(confirm("Keluar dari aplikasi?")) { localStorage.removeItem('maka_user'); window.location.href = 'index.html'; } };
    </script>
</body>
</html>
