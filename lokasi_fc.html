<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU - Station Locator</title>
    
    <script>
        const LOCATOR_VERSION = "ELITE_V2.5_LOCATOR"; 
        if (localStorage.getItem('mlu_locator_v') !== LOCATOR_VERSION) {
            if ('caches' in window) { caches.keys().then((names) => { names.forEach(name => { caches.delete(name); }); }); }
            localStorage.setItem('mlu_locator_v', LOCATOR_VERSION); window.location.reload(true); 
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-canvas: #F4F7FC; --obsidian: #0A1128; --cyan-glow: #00E5FF;
            --gold-lux: #C5A059; --text-main: #0F172A; --text-muted: #64748B;
            --success-glow: #059669; --danger-glow: #E11D48;
            --electric-blue: #2D63ED; --fresh-teal: #0EA5E9; 
            --border-light: #E2E8F0;
        }

        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; overflow: hidden; background: var(--bg-canvas); }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}

        /* MAP ELEMENT */
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* WATERMARK LAYER OVER MAP */
        .bg-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.5) rotate(-15deg); height: 100vh; opacity: 0.08; z-index: 2; pointer-events: none; user-select: none; }

        /* HEADER OVERLAY (GLASSMORPHISM) */
        .header-overlay { position: absolute; top: 0; left: 0; width: 100%; padding: 40px 20px 20px; background: linear-gradient(180deg, rgba(244, 247, 252, 0.95) 0%, rgba(244, 247, 252, 0.5) 60%, transparent 100%); z-index: 1000; text-align: center; pointer-events: none; }
        .header-title { font-family: 'Montserrat'; font-size: 26px; font-weight: 900; color: var(--obsidian); margin: 0; letter-spacing: 1px; text-transform: uppercase;}
        .gps-status { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 50px; font-weight: 800; font-size: 10px; color: var(--obsidian); box-shadow: 0 10px 25px rgba(10,17,40,0.1); margin-top: 10px; pointer-events: auto; cursor: pointer; border: 1px solid var(--border-light);}
        .gps-dot { width: 8px; height: 8px; background: var(--success-glow); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* CUSTOM MARKER CSS (ELITE THEME) */
        .custom-div-icon { background: transparent; border: none; }
        .marker-on { width: 35px; height: 35px; background: var(--obsidian); color: var(--gold-lux); border-radius: 50%; border: 2px solid var(--gold-lux); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 10px 25px rgba(10,17,40,0.3); transition: 0.2s; }
        .marker-off { width: 35px; height: 35px; background: rgba(225,29,72,0.9); color: white; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 10px 25px rgba(225,29,72,0.3); opacity: 0.8; }
        .marker-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); color: var(--obsidian); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; white-space: nowrap; box-shadow: 0 5px 15px rgba(10,17,40,0.15); border: 1px solid var(--border-light); text-transform: uppercase;}
        .marker-label.lbl-off { color: var(--danger-glow); background: #FEF2F2; border-color: #FCA5A5;}
        
        .user-dot { width: 22px; height: 22px; background: var(--fresh-teal); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 8px rgba(14,165,233,0.3), 0 5px 15px rgba(0,0,0,0.3); }

        /* BOTTOM SHEET POPUP (GLASSMORPHISM) */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 1px solid white; border-top-left-radius: 35px; border-top-right-radius: 35px; padding: 30px 25px; box-shadow: 0 -15px 40px rgba(10,17,40,0.15); z-index: 2000; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; }
        .bottom-sheet.show { bottom: 0; }
        
        .bs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bs-title { font-size: 22px; font-weight: 900; color: var(--obsidian); margin: 0; text-transform: uppercase; }
        .btn-close { width: 40px; height: 40px; background: #F1F5F9; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border: none; font-size: 18px; cursor: pointer; transition: 0.2s;}
        .btn-close:active { transform: scale(0.9); background: #E2E8F0;}

        /* DETAILS BADGES STYLING */
        .sheet-details { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .badge-info { padding: 6px 12px; border-radius: 10px; font-size: 10px; font-weight: 900; text-transform: uppercase; border: 1px solid; display: inline-flex; align-items: center; gap: 5px; letter-spacing: 0.5px;}

        .info-bar { background: rgba(197, 160, 89, 0.1); border: 1px dashed rgba(197, 160, 89, 0.4); border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; font-weight: 900; color: var(--obsidian); font-size: 14px;}
        .info-bar i { font-size: 18px; color: var(--gold-lux);}

        .btn-nav { width: 100%; padding: 20px; border: none; border-radius: 18px; background: var(--obsidian); color: var(--gold-lux); font-weight: 900; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(10,17,40,0.2); transition: 0.2s; letter-spacing: 1px;}
        .btn-nav:active { transform: scale(0.96); }
        .btn-nav.disabled { background: var(--danger-glow); color: white; box-shadow: 0 10px 25px rgba(225,29,72,0.3); cursor: not-allowed; }

        /* TOMBOL KEMBALI KE HOME */
        .btn-home { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); color: var(--obsidian); padding: 16px 30px; border-radius: 50px; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 15px 35px rgba(10,17,40,0.15); border: 1px solid var(--border-light); text-decoration: none; z-index: 1500; transition: 0.3s;}
        .btn-home:active { transform: scale(0.95); background: var(--obsidian); color: var(--gold-lux);}
        .btn-home.hide { bottom: -100px; } 
    </style>
</head>
<body>

    <div id="map"></div>
    <img src="logomlumaster.png" class="bg-watermark" alt="" onerror="this.style.display='none'">

    <div class="header-overlay">
        <h1 class="header-title">LOKASI FC MAKA </h1>
        <div class="gps-status" onclick="recenterMap()">
            <div class="gps-dot" id="gpsIndicator"></div> <span id="gpsText">MENCARI GPS...</span>
        </div>
    </div>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="bs-header">
            <h2 class="bs-title" id="sheetTitle">NAMA FC</h2>
            <button class="btn-close" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="sheet-details" id="sheetDetails"></div>

        <div class="info-bar" id="sheetInfoBar">
            <i class="fas fa-route"></i> <span id="sheetDist">0 KM</span> • <i class="fas fa-clock"></i> <span id="sheetTime">0 MNT</span>
        </div>
        <button class="btn-nav" id="btnNav"><i class="fas fa-location-arrow"></i> BUKA NAVIGASI GOOGLE</button>
    </div>

    <a href="dashboard.html" class="btn-home" id="btnHome"><i class="fas fa-arrow-left"></i> KEMBALI KE HOME</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // KONEKSI FIREBASE
        const firebaseConfig = { apiKey: "AIzaSyAk3G5aQUBVe_g7_peVu1F6xllP_RejGq0", authDomain: "rtomaka-e67b5.firebaseapp.com", projectId: "rtomaka-e67b5", storageBucket: "rtomaka-e67b5.firebasestorage.app", messagingSenderId: "472036722228", appId: "1:472036722228:web:11d520f9204db317d02c61" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const locRef = collection(db, "fc_locations");

        let map, userMarker, watchId;
        let myLat = -6.1754, myLng = 106.8272; // Default point
        let fcMarkers = [];

        // INIT MAP
        map = L.map('map', { zoomControl: false }).setView([myLat, myLng], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'CartoDB' }).addTo(map);

        // DATA UTAMA (FIXED) DIBERIKAN DEFAULT INFO
        const fixedStations = [
            { id: 'gading', name: 'FC Kelapa Gading', lat: -6.159389, lng: 106.901416, isActive: true, mapLink: '', provider: 'PLN', nozzleCount: 3, is24Hours: true },
            { id: 'kc', name: 'Kartika Chandra', lat: -6.2285953, lng: 106.819502, isActive: true, mapLink: '', provider: 'PLN', nozzleCount: 2, is24Hours: true }
        ];

        // TRACK GPS USER (OTOMATIS POINTING SAAT KOORDINAT DIDAPAT)
        if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition((pos) => {
                myLat = pos.coords.latitude;
                myLng = pos.coords.longitude;
                
                document.getElementById('gpsText').innerText = "GPS AKTIF (TAP UTK RE-CENTER)";
                document.getElementById('gpsIndicator').style.background = "var(--success-glow)";

                if (!userMarker) {
                    const uIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="user-dot"></div>`, iconSize: [22,22] });
                    userMarker = L.marker([myLat, myLng], { icon: uIcon, zIndexOffset: 1000 }).addTo(map);
                    // OTOMATIS CENTER KE LOKASI USER SAAT PERTAMA KALI KEBACA
                    map.setView([myLat, myLng], 13);
                } else {
                    userMarker.setLatLng([myLat, myLng]);
                }
            }, (err) => {
                document.getElementById('gpsText').innerText = "GPS MATI / TIDAK DIIZINKAN";
                document.getElementById('gpsIndicator').style.background = "var(--danger-glow)";
            }, { enableHighAccuracy: true });
        }

        window.recenterMap = () => { if(userMarker) map.setView([myLat, myLng], 14); }

        // BACA DATABASE FIREBASE SECARA REALTIME
        onSnapshot(locRef, (snap) => {
            fcMarkers.forEach(m => map.removeLayer(m));
            fcMarkers = [];

            let allLocations = [...fixedStations]; 
            
            snap.forEach(doc => {
                allLocations.push({ id: doc.id, ...doc.data() });
            });

            allLocations.forEach(loc => {
                const isOff = loc.isActive === false;
                
                const iconHtml = isOff 
                    ? `<div class="marker-off"><i class="fas fa-ban"></i></div><div class="marker-label lbl-off">${loc.name}</div>`
                    : `<div class="marker-on"><i class="fas fa-bolt"></i></div><div class="marker-label">${loc.name}</div>`;

                const mIcon = L.divIcon({ className: 'custom-div-icon', html: iconHtml, iconSize: [35,35], iconAnchor: [17, 35] });
                
                const marker = L.marker([loc.lat, loc.lng], { icon: mIcon }).addTo(map);
                
                marker.on('click', () => {
                    openSheet(loc);
                    map.setView([loc.lat, loc.lng], 14); 
                });

                fcMarkers.push(marker);
            });
        });

        // LOGIKA BOTTOM SHEET
        function openSheet(loc) {
            document.getElementById('sheetTitle').innerText = loc.name;
            
            // 1. RENDER BADGE INFORMASI TAMBAHAN (DIUBAH TEMA ELITE)
            const detailsCont = document.getElementById('sheetDetails');
            let detailsHtml = '';
            
            if (loc.provider) {
                detailsHtml += `<span class="badge-info" style="background: var(--obsidian); color: var(--gold-lux); border-color: var(--gold-lux);"><i class="fas fa-charging-station"></i> ${loc.provider}</span>`;
            }
            if (loc.nozzleCount) {
                detailsHtml += `<span class="badge-info" style="background: rgba(197, 160, 89, 0.1); color: var(--obsidian); border-color: rgba(197, 160, 89, 0.4);"><i class="fas fa-plug"></i> ${loc.nozzleCount} NOZZLE</span>`;
            }
            if (loc.is24Hours !== undefined) {
                if (loc.is24Hours) {
                    detailsHtml += `<span class="badge-info" style="background: var(--success-glow); color: white; border-color: var(--success-glow);"><i class="fas fa-clock"></i> 24 JAM</span>`;
                } else {
                    detailsHtml += `<span class="badge-info" style="background: var(--danger-glow); color: white; border-color: var(--danger-glow);"><i class="fas fa-hourglass-end"></i> TERBATAS</span>`;
                }
            }
            detailsCont.innerHTML = detailsHtml;

            // 2. HITUNG JARAK & WAKTU
            const dist = calculateDist(myLat, myLng, loc.lat, loc.lng);
            document.getElementById('sheetDist').innerText = `${dist.toFixed(1)} KM`;
            document.getElementById('sheetTime').innerText = `${Math.ceil((dist/25)*60)} MNT`;

            const btnNav = document.getElementById('btnNav');

            if (loc.isActive !== false) {
                document.getElementById('sheetInfoBar').style.background = "rgba(197, 160, 89, 0.1)";
                document.getElementById('sheetInfoBar').style.color = "var(--obsidian)";
                
                btnNav.className = 'btn-nav';
                btnNav.innerHTML = '<i class="fas fa-location-arrow"></i> BUKA NAVIGASI GOOGLE';
                btnNav.onclick = () => {
                    const destUrl = loc.mapLink || `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
                    window.open(destUrl, '_blank');
                };
            } else {
                document.getElementById('sheetInfoBar').style.background = "#FEF2F2";
                document.getElementById('sheetInfoBar').style.color = "var(--danger-glow)";

                btnNav.className = 'btn-nav disabled';
                btnNav.innerHTML = `<i class="fas fa-lock"></i> OFFLINE: ${loc.statusMsg || 'Sedang Perbaikan'}`;
                btnNav.onclick = null; 
            }

            document.getElementById('bottomSheet').classList.add('show');
            document.getElementById('btnHome').classList.add('hide'); 
        }

        window.closeSheet = () => {
            document.getElementById('bottomSheet').classList.remove('show');
            document.getElementById('btnHome').classList.remove('hide');
            recenterMap(); 
        }

        function calculateDist(lat1, lon1, lat2, lon2) { 
            const p = 0.017453292519943295, c = Math.cos; 
            const a = 0.5 - c((lat2 - lat1) * p)/2 + c(lat1 * p) * c(lat2 * p) * (1 - c((lon2 - lon1) * p))/2; 
            return 12742 * Math.asin(Math.sqrt(a)); 
        }

        map.on('click', () => { closeSheet(); });
    </script>
</body>
</html>
