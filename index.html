<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU Super App - Login Premium</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logomlu2.png">
    <link rel="apple-touch-icon" href="logomlu2.png">
    <meta name="theme-color" content="#FFFFFF">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-canvas: #F4F7FC; --obsidian: #0A1128; --cyan-glow: #00E5FF;
            --gold-lux: #C5A059; --text-main: #0F172A; --text-muted: #64748B;
            --success: #059669; --warning: #D97706; --danger: #DC2626;
            --electric-blue: #2D63ED; --fresh-teal: #0EA5E9; 
        }
        
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-canvas); font-family: 'Montserrat', sans-serif; overflow: hidden; position: relative;}
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        /* ELITE BACKGROUND */
        body {
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.06), transparent 40%),
                linear-gradient(rgba(10, 17, 40, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 17, 40, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }

        .bg-watermark { position: fixed; bottom: -10%; right: -25%; height: 100vh; opacity: 0.08; transform: scale(1.1) rotate(-15deg); z-index: 0; pointer-events: none; user-select: none; }

        /* --- SPLASH SCREEN (GLASSMORPHISM) --- */
        #splashScreen { 
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.8s ease-out; 
        }
        
        .splash-top-art { margin-bottom: -15px; opacity: 0; animation: fadeUp 1s ease-out 0.1s forwards; pointer-events: none; }
        .neon-curve-text { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; animation: rgbGlow 3s infinite linear; }
        .splash-title { font-family: 'Montserrat'; font-size: 42px; font-weight: 900; color: var(--obsidian); margin: 0; text-align: center; line-height: 1; letter-spacing: 2px; text-transform: uppercase; opacity: 0; animation: fadeUp 1s ease-out 0.3s forwards; position: relative; z-index: 2;}
        .splash-loader { margin-top: 40px; width: 60px; height: 4px; background: rgba(10,17,40,0.1); border-radius: 10px; overflow: hidden; position: relative; opacity: 0; animation: fadeUp 1s ease-out 0.6s forwards;}
        .splash-loader::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: var(--gold-lux); border-radius: 10px; animation: loadingBar 1.5s infinite ease-in-out; box-shadow: 0 0 15px rgba(197,160,89,0.5);}

        /* --- LOGIN SCREEN (GLASSMORPHISM) --- */
        #loginScreen { 
            display: none; flex-direction: column; height: 100%; 
            opacity: 0; transition: opacity 0.5s ease-in; 
            padding: 20px; align-items: center; justify-content: center; 
            position: relative; z-index: 10;
        }

        .login-card-glass { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid white;
            width: 100%; max-width: 400px; border-radius: 35px; 
            padding: 40px 30px; box-shadow: 0 25px 50px rgba(10,17,40,0.1); 
            text-align: center; 
        }

        .login-logo-wrap {
            width: 95px; height: 95px; margin: 0 auto 20px;
            background: white;
            border-radius: 25px; padding: 10px;
            box-shadow: 0 15px 30px rgba(10,17,40,0.1), inset 0 0 0 2px rgba(255,255,255,1);
            display: flex; align-items: center; justify-content: center;
        }
        .login-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .login-title { font-family: 'Montserrat'; font-size: 24px; font-weight: 900; color: var(--obsidian); margin: 0 0 8px 0; text-transform: uppercase;}
        .login-subtitle { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 25px; line-height: 1.5; padding: 0 10px;}

        .form-group { margin-bottom: 20px; text-align: left; position: relative;}
        .form-group label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px;}
        .input-icon { position: absolute; left: 20px; top: 35px; color: var(--obsidian); font-size: 16px; }
        
        .form-input-glass { 
            width: 100%; padding: 16px 16px 16px 50px; border-radius: 16px; 
            background: rgba(255, 255, 255, 0.8); 
            border: 1px solid var(--border-light); 
            font-family: 'Montserrat'; font-weight: 700; font-size: 14px; 
            color: var(--text-main); transition: 0.3s; text-transform: uppercase;
        }
        .form-input-glass:focus { background: white; border-color: var(--gold-lux); box-shadow: 0 0 15px rgba(197,160,89,0.15); }
        .form-input-glass::placeholder { color: #94A3B8; text-transform: none; font-weight: 500;}

        .btn-login-premium { 
            width: 100%; padding: 18px; border: none; border-radius: 16px; 
            background: var(--obsidian); 
            color: var(--gold-lux); font-family: 'Montserrat'; font-size: 14px; font-weight: 900; 
            margin-top: 10px; cursor: pointer; box-shadow: 0 15px 30px rgba(10,17,40,0.2); 
            transition: 0.2s; letter-spacing: 1px; position: relative; overflow: hidden;
        }
        .btn-login-premium:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(10,17,40,0.3); }

        .error-msg { background: rgba(225, 29, 72, 0.1); border: 1px dashed var(--danger); color: var(--danger); font-size: 11px; font-weight: 700; margin-top: 15px; margin-bottom: 5px; padding: 12px; border-radius: 12px; display: none; }

        .copyright { margin-top: 35px; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; opacity: 0.8; }

        /* --- CUSTOM INSTALL POPUP --- */
        .install-modal { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(25px); border-top: 1px solid white; padding: 30px 25px; border-top-left-radius: 35px; border-top-right-radius: 35px; box-shadow: 0 -15px 40px rgba(10,17,40,0.1); z-index: 10000; text-align: center; transform: translateY(100%); animation: slideUpModal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .install-icon { width: 65px; height: 65px; border-radius: 18px; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .install-title { font-family: 'Montserrat'; font-size: 18px; font-weight: 900; color: var(--obsidian); margin: 0 0 5px 0; text-transform: uppercase;}
        .install-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 25px; font-weight: 600; line-height: 1.5; }
        .btn-install { background: var(--obsidian); color: var(--gold-lux); border: none; padding: 18px; width: 100%; border-radius: 16px; font-family: 'Montserrat'; font-size: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px rgba(10,17,40,0.2); margin-bottom: 10px; letter-spacing: 1px;}
        .btn-close-install { background: transparent; color: #94A3B8; border: none; padding: 10px; width: 100%; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* ANIMATIONS */
        @keyframes fadeUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes loadingBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        @keyframes slideUpModal { to { transform: translateY(0); } }
        @keyframes rgbGlow { 0% { fill: #0A1128; filter: drop-shadow(0 0 8px rgba(10,17,40, 0.5)); } 50% { fill: #C5A059; filter: drop-shadow(0 0 8px rgba(197,160,89, 0.5)); } 100% { fill: #0A1128; filter: drop-shadow(0 0 8px rgba(10,17,40, 0.5)); } }
    </style>
</head>
<body>

    <img src="logomlumaster.png" class="bg-watermark" alt="" onerror="this.style.display='none'">

    <div id="splashScreen">
        <div class="splash-top-art">
            <svg width="320" height="90" viewBox="0 0 320 90">
                <path id="curve" d="M 20,80 Q 160,-10 300,80" fill="transparent" stroke="none" />
                <text class="neon-curve-text">
                    <textPath href="#curve" startOffset="50%" text-anchor="middle">
                        Made With ❤️ For MLU Family
                    </textPath>
                </text>
            </svg>
        </div>
        <h1 class="splash-title">MLU<br>SUPER APP</h1>
        <div class="splash-loader"></div>
    </div>

    <div id="loginScreen">
        <div class="login-card-glass">
            
            <div class="login-logo-wrap">
                <img src="logomlumaster.png" class="login-logo" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/854/854878.png'">
            </div>
            
            <h2 class="login-title">LOGIN MEMBER</h2>
            <div class="login-subtitle">Jika ini login pertama Anda, PIN yang diketik akan otomatis menjadi PIN Permanen.</div>

            <div class="form-group">
                <label>Plat Nomor Kendaraan</label>
                <i class="fas fa-motorcycle input-icon"></i>
                <input type="text" id="inputPlat" class="form-input-glass" placeholder="B 1234 XYZ" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Secure PIN (4 Angka)</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="inputPin" class="form-input-glass" placeholder="****" pattern="[0-9]*" inputmode="numeric" maxlength="4">
            </div>

            <div id="errorBox" class="error-msg"></div>
            
            <button class="btn-login-premium" id="btnLogin" onclick="prosesLogin()">
                MASUK APLIKASI
            </button>
        </div>
        
        <div class="copyright">
            &copy; 2026 Komunitas Maka Lintas Utara
        </div>
    </div>

    <div class="install-modal" id="installModal">
        <img src="logomlumaster.png" class="install-icon" alt="App Icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/854/854878.png'">
        <h3 class="install-title">Install MLU Super App</h3>
        <p class="install-desc">Tambahkan aplikasi ini ke layar utama HP Anda untuk akses lebih cepat dan pengalaman terbaik.</p>
        <button class="btn-install" onclick="triggerInstall()"><i class="fas fa-download"></i> INSTALL SEKARANG</button>
        <button class="btn-close-install" onclick="closeInstall()">Nanti saja</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAk3G5aQUBVe_g7_peVu1F6xllP_RejGq0", authDomain: "rtomaka-e67b5.firebaseapp.com", projectId: "rtomaka-e67b5", storageBucket: "rtomaka-e67b5.firebasestorage.app", messagingSenderId: "472036722228", appId: "1:472036722228:web:11d520f9204db317d02c61" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./firebase-messaging-sw.js')
                .then((reg) => console.log('Service Worker Registrasi Berhasil', reg))
                .catch((err) => console.log('SW Reg Failed', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e; 
        });

        window.triggerInstall = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                await deferredPrompt.userChoice; 
                deferredPrompt = null; document.getElementById('installModal').style.display = 'none';
            }
        };

        window.closeInstall = () => { document.getElementById('installModal').style.display = 'none'; };

        document.addEventListener("DOMContentLoaded", () => {
            const userData = localStorage.getItem('maka_user');
            
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    if (userData) {
                        window.location.href = 'dashboard.html';
                    } else {
                        const loginBox = document.getElementById('loginScreen');
                        loginBox.style.display = 'flex';
                        setTimeout(() => { 
                            loginBox.style.opacity = '1'; 
                            if (deferredPrompt) {
                                setTimeout(() => { document.getElementById('installModal').style.display = 'block'; }, 1000);
                            }
                        }, 50);
                    }
                }, 800); 
            }, 3500); 
        });

        document.getElementById('inputPlat').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });

        window.prosesLogin = async () => {
            const rawPlat = document.getElementById('inputPlat').value.trim().toUpperCase();
            const pin = document.getElementById('inputPin').value.trim();
            const errBox = document.getElementById('errorBox');
            const btn = document.getElementById('btnLogin');

            if (!rawPlat || !pin) { errBox.innerHTML = "<i class='fas fa-exclamation-triangle'></i> Plat Nomor dan PIN wajib diisi!"; errBox.style.display = 'block'; return; }
            if (pin.length !== 4) { errBox.innerHTML = "<i class='fas fa-exclamation-triangle'></i> PIN harus persis 4 angka!"; errBox.style.display = 'block'; return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MEMERIKSA...';
            btn.style.opacity = '0.7'; errBox.style.display = 'none';

            try {
                const querySnapshot = await getDocs(collection(db, "mlu_members"));
                
                let userData = null; 
                let docId = null;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const platDiDatabase = data.plat || data.Plat || data.PLAT || data.plat_nomor || "";
                    
                    const platBersihDB = String(platDiDatabase).replace(/\s+/g, '').toUpperCase();
                    const platBersihInput = rawPlat.replace(/\s+/g, '');

                    if (platBersihDB === platBersihInput && platBersihDB !== "") {
                        userData = data;
                        docId = docSnap.id;
                    }
                });

                if (!userData) {
                    errBox.innerHTML = `<i class='fas fa-times-circle'></i> Plat <b>${rawPlat}</b> tidak terdaftar!`;
                    errBox.style.display = 'block'; btn.innerHTML = 'MASUK APLIKASI'; btn.style.opacity = '1'; return;
                }

                if (!userData.pin || userData.pin === "") {
                    try {
                        await updateDoc(doc(db, "mlu_members", docId), { pin: pin });
                        userData.pin = pin; 
                    } catch (e) {
                        errBox.innerHTML = `<i class='fas fa-times-circle'></i> Gagal menyimpan PIN baru.`;
                        errBox.style.display = 'block'; btn.innerHTML = 'MASUK APLIKASI'; btn.style.opacity = '1'; return;
                    }
                } else {
                    if (pin !== String(userData.pin)) {
                        errBox.innerHTML = `<i class='fas fa-times-circle'></i> PIN Salah!`;
                        errBox.style.display = 'block'; btn.innerHTML = 'MASUK APLIKASI'; btn.style.opacity = '1'; return;
                    }
                }

                const platCek = rawPlat.replace(/\s+/g, '');
                if (platCek === "B4248SWF") {
                    userData.isSuperAdmin = true;
                    userData.role = "PENGURUS";
                }

                userData.id = docId; localStorage.setItem('maka_user', JSON.stringify(userData));
                
                btn.innerHTML = '<i class="fas fa-check-circle"></i> BERHASIL!';
                btn.style.background = 'var(--success)';
                btn.style.opacity = '1';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);

            } catch (error) {
                errBox.innerHTML = "<i class='fas fa-wifi'></i> Gangguan koneksi. Coba lagi.";
                errBox.style.display = 'block'; btn.innerHTML = 'MASUK APLIKASI'; btn.style.opacity = '1';
                console.error(error);
            }
        };

        document.getElementById('inputPin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { prosesLogin(); }
        });
        document.getElementById('inputPlat').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { document.getElementById('inputPin').focus(); }
        });
    </script>
</body>
</html>
