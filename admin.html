<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPER ADMIN - FC KG</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-canvas: #F4F7FC; --obsidian: #0A1128; --cyan-glow: #00E5FF;
            --gold-lux: #C5A059; --text-main: #0F172A; --text-muted: #64748B;
            --success-glow: #059669; --warning: #D97706; --danger-glow: #E11D48;
            --electric-blue: #2D63ED; --fresh-teal: #0EA5E9; 
            --border-light: #E2E8F0;
        }

        body { 
            margin: 0; padding: 15px; padding-bottom: 60px; background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.06), transparent 40%),
                linear-gradient(rgba(10, 17, 40, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 17, 40, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Montserrat', sans-serif; color: var(--text-main);
            -webkit-tap-highlight-color: transparent; position: relative;
        }

        * { box-sizing: border-box; outline: none; }

        /* WATERMARK BACKGROUND LOGO */
        .bg-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.5) rotate(-15deg); height: 100vh; opacity: 0.08; z-index: -1; pointer-events: none; user-select: none; }

        /* HEADER */
        .adm-header { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px);
            padding: 18px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(10,17,40,0.05); 
            border: 1px solid var(--border-light); position: relative; z-index: 10;
        }

        /* SECTION BOX (GLASSMORPHISM) */
        .box { 
            background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); 
            border: 1px solid white; padding: 20px; 
            margin-bottom: 20px; border-radius: 24px; box-shadow: 0 15px 40px rgba(10,17,40,0.04); 
            position: relative; z-index: 10;
        }
        
        h3 { 
            margin: 0 0 15px 0; color: var(--obsidian); border-bottom: 1px dashed var(--border-light); 
            padding-bottom: 12px; font-size: 16px; font-weight: 900; text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* BUTTONS */
        button { 
            cursor: pointer; padding: 12px 15px; font-weight: 900; font-family: 'Montserrat'; 
            font-size: 11px; border-radius: 12px; transition: 0.2s; border: none; 
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.5px;
        }
        button:active { transform: scale(0.95); }
        .btn-red { background: rgba(225,29,72,0.1); color: var(--danger-glow); }
        .btn-red:active { background: var(--danger-glow); color: white; }
        .btn-green { background: var(--success-glow); color: white; box-shadow: 0 5px 15px rgba(5,150,105,0.2); }
        .btn-blue { background: rgba(14,165,233,0.1); color: var(--fresh-teal); }
        .btn-blue:active { background: var(--fresh-teal); color: white; }
        .btn-gold { background: var(--obsidian); color: var(--gold-lux); box-shadow: 0 5px 15px rgba(10,17,40,0.2); }

        /* FORM INPUTS */
        input, select { 
            background: #F8FAFC; color: var(--obsidian); border: 1px solid var(--border-light); 
            padding: 14px; border-radius: 14px; font-family: 'Montserrat'; font-weight:700; font-size: 14px;
            width: 100%; box-sizing: border-box; text-transform: uppercase; transition: 0.2s; outline: none;
        }
        input:focus, select:focus { border-color: var(--gold-lux); background: white; box-shadow: 0 0 0 3px rgba(197,160,89,0.1); }

        /* MODERN CARDS FOR SLOTS & QUEUE */
        .admin-card {
            background: rgba(255,255,255,0.9); border: 1px solid var(--border-light); border-radius: 18px; padding: 16px;
            margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(10,17,40,0.02);
        }
        .admin-card.active {
            background: white; border: 2px solid var(--gold-lux); box-shadow: 0 10px 25px rgba(197,160,89,0.1);
        }
        
        .ac-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .ac-title { font-size: 18px; font-weight: 900; color: var(--obsidian); margin-bottom: 4px; text-transform: uppercase;}
        .ac-subtitle { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        .ac-badge { font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 10px;}
        .badge-green { background: rgba(5,150,105,0.1); color: var(--success-glow); border: 1px solid rgba(5,150,105,0.2);}
        .badge-gray { background: #F1F5F9; color: var(--text-muted); font-size: 12px; border: 1px solid #E2E8F0;}

        .ac-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .ac-actions button { flex: 1; padding: 12px; font-size: 10px;}

        /* ANTRIAN LIST SPECIFIC */
        .q-number { font-size: 18px; font-weight: 900; color: var(--text-muted); background: #F8FAFC; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 1px solid var(--border-light);}
        .q-row { display: flex; align-items: center; gap: 15px; border-bottom: 1px dashed var(--border-light); padding-bottom: 12px; margin-bottom: 4px;}
        
        .action-group { background: #F8FAFC; border: 1px solid var(--border-light); border-radius: 14px; padding: 8px; display: flex; gap: 6px; flex: 1; align-items: center;}
        .ag-label { font-size: 9px; font-weight: 800; color: var(--text-muted); padding: 0 5px; letter-spacing: 0.5px;}

        /* EMERGENCY & LOGS */
        .term-container { background: var(--obsidian); border-radius: 18px; padding: 18px; height: 250px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: #94A3B8; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 10px 30px rgba(0,0,0,0.5);}
        .log-line { margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 6px; line-height: 1.4;}

        /* MODAL KACA */
        .modal-glass-overlay { 
            position: fixed; inset: 0; background: rgba(10,17,40,0.7); backdrop-filter: blur(8px); 
            z-index: 99999; display: none; align-items: flex-start; justify-content: center; 
            opacity: 0; transition: opacity 0.3s; padding: 10vh 20px 20px; 
            overflow-y: auto; overscroll-behavior: contain;
        }
        .modal-glass-overlay.show { opacity: 1; display: flex; }
        .modal-box { 
            background: rgba(255,255,255,0.95); border-radius: 30px; padding: 30px 25px; width: 100%; max-width: 380px; 
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3); 
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            margin: auto; border: 1px solid white;
        }
        .modal-glass-overlay.show .modal-box { transform: scale(1); }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        
        .role-tag { font-size: 8px; background: var(--obsidian); color: var(--gold-lux); padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; margin-left: 5px; vertical-align: middle; letter-spacing: 0.5px; border: 1px solid rgba(197,160,89,0.3);}
    </style>
</head>
<body>

    <img src="logomlumaster.png" class="bg-watermark" alt="" onerror="this.style.display='none'">

    <div class="adm-header">
        <div>
            <div style="font-size:20px; font-weight:900; color:var(--obsidian); letter-spacing:-1px; display:flex; align-items:center; gap:8px; text-transform: uppercase;">
                <i class="fas fa-shield-alt" style="color:var(--danger-glow);"></i> SUPER ADMIN
            </div>
            <div style="font-size:10px; font-weight:800; color:var(--text-muted); letter-spacing:1px; margin-top:4px;">
                FC KELAPA GADING <span style="color:var(--success-glow); margin-left:5px; background:rgba(5,150,105,0.1); padding:2px 6px; border-radius:4px;"><i class="fas fa-circle" style="font-size:6px;"></i> ONLINE</span>
            </div>
        </div>
        <div style="display:flex; gap:8px;">
            <button onclick="window.location.href='system.html'" class="btn-blue" style="padding:14px;"><i class="fas fa-cog"></i></button>
            <button onclick="window.location.href='index.html'" class="btn-red" style="padding:14px;" title="Keluar"><i class="fas fa-power-off"></i></button>
        </div>
    </div>

    <div class="box" style="border-top: 4px solid var(--fresh-teal);">
        <h3><div style="display:flex; align-items:center; gap:8px;"><i class="fas fa-tv" style="color:var(--fresh-teal);"></i> SLOT CHARGER</div></h3>
        <div id="slotContainer">
            <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:12px; font-weight:600;"><i class="fas fa-spinner fa-spin"></i> Memuat Slot...</div>
        </div>
        
        <div style="margin-top:15px; background:rgba(255,255,255,0.5); padding:15px; border-radius:18px; border:1px dashed var(--border-light);">
            <div style="font-size:10px; font-weight:800; color:var(--obsidian); margin-bottom:10px; letter-spacing:0.5px;">SWAP / TUKAR POSISI USER:</div>
            <div style="display:flex; align-items:center; gap:10px;">
                <select id="moveSrc"><option value="0">S1</option><option value="1">S2</option><option value="2">S3</option></select>
                <i class="fas fa-exchange-alt" style="color:var(--text-muted);"></i>
                <select id="moveDest"><option value="1">S2</option><option value="2">S3</option><option value="0">S1</option></select>
                <button onclick="askConfirm('Tukar Posisi User di Slot?', moveSlotUser)" class="btn-blue" style="padding:16px;"><i class="fas fa-check"></i></button>
            </div>
        </div>
    </div>

    <div class="box" style="border-top: 4px solid var(--gold-lux);">
        <h3>
            <div style="display:flex; align-items:center; gap:8px;"><i class="fas fa-users" style="color:var(--gold-lux);"></i> DAFTAR TUNGGU</div>
            <button onclick="askConfirm('RESET URUTAN NOMOR JADI 1? (Orang tetap ada)', resetTicketNumbers)" class="btn-red" style="padding:10px 14px; font-size:10px;"><i class="fas fa-sync-alt"></i> RE-INDEX</button>
        </h3>
        
        <div id="queueContainer" style="max-height:450px; overflow-y:auto; padding-right:5px; margin-bottom:15px;">
            <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:12px; font-weight:600;"><i class="fas fa-spinner fa-spin"></i> Memuat Antrian...</div>
        </div>
        
        <div style="background:rgba(197,160,89,0.05); padding:18px; border-radius:18px; border: 1px dashed rgba(197,160,89,0.4);">
            <div style="font-size:11px; font-weight:900; color:var(--obsidian); margin-bottom:12px; display:flex; align-items:center; gap:6px;"><i class="fas fa-bolt" style="color:var(--gold-lux);"></i> FORCE INPUT (TAMBAH MANUAL)</div>
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;">
                <input id="newPlat" placeholder="PLAT (Contoh: B 7777 PEA)">
                <div style="display:flex; gap:10px;">
                    <input id="newNama" placeholder="NAMA USER" style="flex:2;">
                    <input id="newBatre" type="number" placeholder="BATRE (%)" style="flex:1;" max="100">
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="manualAdd('queue')" class="btn-green" style="flex:2; padding:15px;"><i class="fas fa-plus"></i> ANTRIAN</button>
                <button onclick="manualAdd(0)" class="btn-gold" style="flex:1;">S1</button>
                <button onclick="manualAdd(1)" class="btn-gold" style="flex:1;">S2</button>
                <button onclick="manualAdd(2)" class="btn-gold" style="flex:1;">S3</button>
            </div>
        </div>
    </div>

    <div class="box" style="background: rgba(225,29,72,0.05); border: 1px dashed rgba(225,29,72,0.3); border-top: 4px solid var(--danger-glow);">
        <h3 style="color:var(--danger-glow); border-bottom-color:rgba(225,29,72,0.2);"><div style="display:flex; align-items:center; gap:8px;"><i class="fas fa-exclamation-triangle"></i> EMERGENCY ZONE</div></h3>
        <div style="display:flex; gap:10px;">
            <button onclick="checkRecovery()" class="btn-blue" style="flex:1; background:white; border:1px solid var(--electric-blue); color:var(--electric-blue);"><i class="fas fa-folder-open"></i> CEK BACKUP</button>
            <button onclick="askConfirm('HAPUS SEMUA DATA SISTEM? (TIDAK BISA KEMBALI)', hardReset)" class="btn-red" style="flex:1; background:var(--danger-glow); color:white;"><i class="fas fa-skull"></i> FORMAT</button>
        </div>
        <div id="recoveryPanel" style="display:none; margin-top:15px; background:white; padding:20px; border-radius:16px; border:1px dashed var(--danger-glow); box-shadow:0 10px 25px rgba(225,29,72,0.1);">
            <div id="recList" style="font-size:11px; font-weight:800; margin-bottom:15px; color:var(--obsidian);"></div>
            <button onclick="executeRestore()" class="btn-green" style="width:100%; padding:15px;"><i class="fas fa-trash-restore"></i> PULIHKAN DATA SISTEM</button>
        </div>
    </div>

    <div id="logSectionWrapper" style="display: none; position: relative; z-index: 10;">
        <div style="font-size:11px; font-weight:900; color:var(--obsidian); margin-bottom:10px; letter-spacing:1px; background:white; padding:10px 15px; border-radius:12px; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border-light);"><i class="fas fa-terminal" style="color:var(--fresh-teal);"></i> AKTIVITAS SISTEM (PRIVATE)</div>
        <div class="term-container" id="termLog"></div>
    </div>

    <div class="modal-glass-overlay" id="customModal">
        <div class="modal-box">
            <div style="width:70px; height:70px; border-radius:50%; background:rgba(225,29,72,0.1); color:var(--danger-glow); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 20px; border:2px solid var(--danger-glow);"><i class="fas fa-question"></i></div>
            <h2 style="margin:0 0 15px 0; font-size:22px; font-weight:900; color:var(--obsidian); text-transform:uppercase;">KONFIRMASI</h2>
            <div id="modalText" style="color:var(--text-muted); font-weight:600; margin-bottom:25px; font-size:13px; line-height:1.6;">Text</div>
            <div class="modal-btns">
                <button onclick="closeModal()" style="flex:1; background:#F1F5F9; color:var(--text-muted); padding:16px;">BATAL</button>
                <button id="btnYes" style="flex:1; background:var(--danger-glow); color:white; box-shadow:0 10px 25px rgba(225,29,72,0.3); padding:16px;">YA, LANJUTKAN</button>
            </div>
        </div>
    </div>

    <div class="modal-glass-overlay" id="editModal">
        <div class="modal-box" style="text-align: left;">
            <h2 style="margin:0 0 20px 0; font-size:20px; font-weight:900; color:var(--obsidian); text-align:center; border-bottom:1px solid var(--border-light); padding-bottom:15px; text-transform:uppercase;">EDIT PENGGUNA</h2>
            
            <div style="margin-bottom:15px;">
                <label style="font-size:10px; font-weight:800; color:var(--text-muted); display:block; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">PLAT NOMOR</label>
                <input id="editPlat" type="text">
            </div>
            
            <div style="margin-bottom:15px;">
                <label style="font-size:10px; font-weight:800; color:var(--text-muted); display:block; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">NAMA USER</label>
                <input id="editName" type="text">
            </div>
            
            <div style="margin-bottom:25px;">
                <label style="font-size:10px; font-weight:800; color:var(--text-muted); display:block; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">SISA BATRE (%)</label>
                <input id="editBatt" type="number" max="100">
            </div>

            <input type="hidden" id="editIndex"> 
            <div class="modal-btns">
                <button onclick="closeEditModal()" style="flex:1; background:#F1F5F9; color:var(--text-muted); padding:16px;">BATAL</button>
                <button onclick="saveEdit()" style="flex:1; background:var(--success-glow); color:white; box-shadow:0 10px 25px rgba(5,150,105,0.3); padding:16px;"><i class="fas fa-save"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, collection, addDoc, query, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CEK PLAT UNTUK PRIVATE LOG (Cuma B4248SWF yang bisa liat)
        const checkDewaLog = () => {
            try {
                const uDataGlobal = JSON.parse(localStorage.getItem('maka_user') || '{}');
                const globalPlat = (uDataGlobal.plat || '').replace(/\s+/g, '').toUpperCase();
                if(globalPlat === 'B4248SWF') {
                    document.getElementById('logSectionWrapper').style.display = 'block';
                }
            } catch(e) {}
        };
        checkDewaLog();

        const firebaseConfig = { apiKey: "AIzaSyB666i9lYWIpxOdkwpoX9EvFvHLmHczeq8", authDomain: "fcgadingnew22.firebaseapp.com", projectId: "fcgadingnew22", storageBucket: "fcgadingnew22.firebasestorage.app", messagingSenderId: "537736846678", appId: "1:537736846678:web:53788d71a196423ac08af7" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const mainRef = doc(db, "antrian", "utama");
        const logRef = collection(db, "activityLog");
        const snapshotRef = doc(db, "antrian", "snapshot");

        let cachedSlots = [null, null, null];
        let cachedQueue = [];
        let snapshotData = null;

        // FUNGSI TARIK IDENTITAS ADMIN DARI BROWSER (Maka_User)
        const getAdminName = () => {
            try {
                const uData = JSON.parse(localStorage.getItem('maka_user'));
                if(uData) {
                    const nama = uData.namaKtp || uData.namaWa || uData.nama || "ADMIN";
                    const plat = uData.plat || "SYSTEM";
                    return `${nama} (${plat})`;
                }
            } catch(e) {}
            return "SUPER_ADMIN";
        };

        // --- MODAL LOGIC ---
        let currentCallback = null;
        window.askConfirm = (text, callback) => {
            document.getElementById('modalText').innerText = text;
            const m = document.getElementById('customModal');
            m.style.display = 'flex'; setTimeout(() => m.classList.add('show'), 10);
            currentCallback = callback;
        };
        document.getElementById('btnYes').onclick = () => { if(currentCallback) currentCallback(); closeModal(); };
        window.closeModal = () => { 
            const m = document.getElementById('customModal');
            m.classList.remove('show'); setTimeout(() => m.style.display = 'none', 300);
            currentCallback = null; 
        };

        // --- EDIT MODAL LOGIC ---
        window.openEdit = (idx) => {
            const user = cachedQueue[idx];
            if(!user) return;
            document.getElementById('editIndex').value = idx;
            document.getElementById('editPlat').value = user.plat;
            document.getElementById('editName').value = user.userName;
            document.getElementById('editBatt').value = user.batreSisa || user.batre || ""; 
            const m = document.getElementById('editModal');
            m.style.display = 'flex'; setTimeout(() => m.classList.add('show'), 10);
        };

        window.closeEditModal = () => { 
            const m = document.getElementById('editModal');
            m.classList.remove('show'); setTimeout(() => m.style.display = 'none', 300);
        };

        window.saveEdit = () => {
            const idx = parseInt(document.getElementById('editIndex').value);
            const p = document.getElementById('editPlat').value.toUpperCase();
            const n = document.getElementById('editName').value.toUpperCase();
            const b = document.getElementById('editBatt').value;
            const admName = getAdminName();

            if(!p || !n) return alert("Plat & Nama tidak boleh kosong!");

            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                let q = d.waitingQueue;
                
                if(q[idx]) {
                    const oldPlat = q[idx].plat;
                    const oldName = q[idx].userName;
                    q[idx].plat = p;
                    q[idx].userName = n;
                    q[idx].batreSisa = b; 
                    q[idx].batre = b + "%";
                    t.update(mainRef, { waitingQueue: q });
                    addLog(admName, "EDIT_USER", `Mengubah data [${oldPlat}] menjadi [${p} - ${n}] (Batre: ${b}%)`);
                }
            }).then(() => {
                closeEditModal();
            }).catch(e => alert("Gagal Update: " + e));
        };

        // === REALTIME MONITORING RENDERER ===
        onSnapshot(mainRef, (snap) => {
            if (!snap.exists()) return;
            const d = snap.data();
            cachedSlots = d.chargingSlots || [null,null,null];
            cachedQueue = d.waitingQueue || [];
            updateMonitorUI();
        });

        function cleanName(n) { return n ? n.replace(/👑/g, '').trim() : 'USER'; }

        function updateMonitorUI() {
            // 1. RENDER SLOTS
            const slotCont = document.getElementById('slotContainer');
            let sHtml = '';
            cachedSlots.forEach((s, i) => {
                if(s) {
                    let bat = s.batreSisa || s.batre || s.battery || "-";
                    let role = (s.role && s.role !== 'GUEST') ? `<span class="role-tag"><i class="fas fa-shield-alt" style="margin-right:3px;"></i>${s.role}</span>` : '';
                    sHtml += `
                        <div class="admin-card active">
                            <div class="ac-header">
                                <div>
                                    <div class="ac-title">${s.plat}</div>
                                    <div class="ac-subtitle">SLOT 0${i+1} • ${cleanName(s.userName)} ${role}</div>
                                </div>
                                <div class="ac-badge badge-green"><i class="fas fa-bolt"></i> ${bat.replace('%','')} %</div>
                            </div>
                            <div class="ac-actions">
                                <button class="btn-red" onclick="askConfirm('Keluarkan user ini dari sistem?', ()=>forceStop(${i}))"><i class="fas fa-times-circle"></i> KICK USER</button>
                                <button class="btn-gold" onclick="askConfirm('Pindahkan kembali ke antrean?', ()=>kickToQueue(${i}))"><i class="fas fa-undo"></i> KE ANTREAN</button>
                            </div>
                        </div>
                    `;
                } else {
                    sHtml += `
                        <div class="admin-card" style="border-style:dashed; box-shadow:none; background:rgba(255,255,255,0.5);">
                            <div class="ac-header" style="align-items:center;">
                                <div>
                                    <div class="ac-title" style="color:var(--text-muted);">SLOT 0${i+1}</div>
                                    <div class="ac-subtitle">Tersedia / Kosong</div>
                                </div>
                                <div class="ac-badge badge-gray"><i class="fas fa-battery-empty"></i> KOSONG</div>
                            </div>
                        </div>
                    `;
                }
            });
            slotCont.innerHTML = sHtml;

            // 2. RENDER ANTREAN
            const qCont = document.getElementById('queueContainer');
            let qHtml = '';
            if(cachedQueue.length === 0) {
                qHtml = `<div style="text-align:center; padding:30px 20px; color:var(--text-muted); font-weight:600; font-size:12px; background:rgba(255,255,255,0.5); border-radius:20px; border:2px dashed var(--border-light);">Antrian Kosong</div>`;
            } else {
                cachedQueue.forEach((q, idx) => {
                    let bat = q.batreSisa || q.batre || q.battery || "-";
                    let role = (q.role && q.role !== 'GUEST') ? `<span class="role-tag"><i class="fas fa-shield-alt" style="margin-right:3px;"></i>${q.role}</span>` : '';
                    
                    qHtml += `
                        <div class="admin-card" style="padding:15px;">
                            <div class="q-row">
                                <div class="q-number">${q.qNo}</div>
                                <div style="flex:1;">
                                    <div style="font-size:16px; font-weight:900; color:var(--obsidian); text-transform:uppercase;">${q.plat} <span style="font-size:10px; color:var(--success-glow); background:rgba(5,150,105,0.1); padding:4px 8px; border-radius:6px; margin-left:6px; border:1px solid rgba(5,150,105,0.3);"><i class="fas fa-bolt"></i> ${bat.replace('%','')}%</span></div>
                                    <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-top:4px;">${cleanName(q.userName)} ${role}</div>
                                </div>
                            </div>
                            <div class="ac-actions">
                                <div class="action-group">
                                    <span class="ag-label">SLOT:</span>
                                    <button class="btn-gold" style="padding:10px;" onclick="forceToSlot('${q.plat}', 0)">1</button>
                                    <button class="btn-gold" style="padding:10px;" onclick="forceToSlot('${q.plat}', 1)">2</button>
                                    <button class="btn-gold" style="padding:10px;" onclick="forceToSlot('${q.plat}', 2)">3</button>
                                </div>
                                <div class="action-group" style="flex:0.8;">
                                    <button class="btn-blue" style="padding:10px; flex:1;" onclick="switchQueue(${idx}, -1)" title="Naik"><i class="fas fa-arrow-up"></i></button>
                                    <button class="btn-blue" style="padding:10px; flex:1;" onclick="switchQueue(${idx}, 1)" title="Turun"><i class="fas fa-arrow-down"></i></button>
                                    <button class="btn-blue" style="padding:10px; flex:1;" onclick="openEdit(${idx})" title="Edit"><i class="fas fa-pen"></i></button>
                                    <button class="btn-red" style="padding:10px; flex:1;" onclick="askConfirm('Hapus user dari daftar?', ()=>delQueue('${q.plat}'))" title="Hapus"><i class="fas fa-times"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            qCont.innerHTML = qHtml;
        }

        window.resetTicketNumbers = () => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                let queue = d.waitingQueue || [];
                queue.forEach((q, index) => { q.qNo = index + 1; });
                t.update(mainRef, { waitingQueue: queue, lastTicket: queue.length });
                addLog(admName, "RESET_NUMBER", `Menyusun ulang nomor urut untuk ${queue.length} antrean`);
            }).catch(e => alert("Gagal: " + e));
        };

        window.manualAdd = async (target) => {
            const p = document.getElementById('newPlat').value.trim().toUpperCase();
            const n = document.getElementById('newNama').value.trim().toUpperCase();
            const b = document.getElementById('newBatre').value;
            const admName = getAdminName();

            if(!p) return alert("Plat Nomor Wajib Diisi!");
            if(!b) return alert("SISA BATERAI WAJIB DIISI!"); 

            let userRole = "GUEST";
            const cleanID = p.replace(/[^A-Z0-9]/g, '');
            try {
                let m = await getDoc(doc(db, "members", cleanID));
                if(m.exists()) userRole = m.data().role || "MEMBER";
            } catch(e) {}

            runTransaction(db, async(t) => {
                const docSnap = await t.get(mainRef);
                let d = docSnap.data();
                if([...(d.chargingSlots||[]), ...d.waitingQueue].some(u => u && u.plat === p)) throw "User sudah ada!";

                const newNo = (d.lastTicket||0)+1;
                const u = { plat:p, userName:n||"MANUAL", qNo:newNo, entryTime:Date.now(), role: userRole, batreSisa: b, batre: b+"%" };

                if(target === 'queue') {
                    d.waitingQueue.push(u); 
                    addLog(admName, "MANUAL_INPUT", `Mendaftarkan manual ${p} (${n||"USER"}) ke Antrean`);
                } else { 
                    if(d.chargingSlots[target]) throw "Slot Penuh!"; 
                    u.startTime = Date.now(); d.chargingSlots[target] = u; 
                    addLog(admName, "BYPASS_SLOT", `Memasukkan manual ${p} (${n||"USER"}) langsung ke Slot 0${target+1}`);
                }

                t.set(snapshotRef, { ...d, backupTime: new Date() });
                t.update(mainRef, { waitingQueue:d.waitingQueue, chargingSlots:d.chargingSlots, lastTicket:newNo });
            }).then(() => {
                document.getElementById('newPlat').value = '';
                document.getElementById('newNama').value = '';
                document.getElementById('newBatre').value = '';
            }).catch(e => alert("GAGAL: " + e));
        };

        window.forceToSlot = (plat, slotIdx) => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                if(d.chargingSlots[slotIdx]) throw "SLOT TERISI!";
                const qIdx = d.waitingQueue.findIndex(x => x.plat === plat);
                if(qIdx === -1) throw "User hilang dari antrean.";
                const user = d.waitingQueue.splice(qIdx, 1)[0];
                user.startTime = Date.now();
                d.chargingSlots[slotIdx] = user;
                t.update(mainRef, { chargingSlots: d.chargingSlots, waitingQueue: d.waitingQueue });
                addLog(admName, "KUDETA_SLOT", `Menarik paksa ${plat} dari antrean ke Slot 0${slotIdx+1}`);
            }).catch(e => alert(e));
        };

        window.forceStop = (i) => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                const u = d.chargingSlots[i];
                if(u) {
                    d.chargingSlots[i] = null;
                    t.update(mainRef, { chargingSlots: d.chargingSlots });
                    addLog(admName, "KICK_USER", `Mengusir paksa ${u.plat} (${cleanName(u.userName)}) dari Slot 0${i+1}`);
                }
            });
        };

        window.kickToQueue = (i) => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                const u = d.chargingSlots[i];
                if(u) {
                    d.chargingSlots[i] = null; delete u.startTime; 
                    d.waitingQueue.unshift(u);
                    t.update(mainRef, { chargingSlots: d.chargingSlots, waitingQueue: d.waitingQueue });
                    addLog(admName, "TURUN_TAHTA", `Menurunkan takhta ${u.plat} dari Slot 0${i+1} kembali ke Antrean`);
                }
            });
        };

        window.moveSlotUser = () => {
            const s1 = document.getElementById('moveSrc').value;
            const s2 = document.getElementById('moveDest').value;
            const admName = getAdminName();
            if(s1 == s2) return alert("Pilih slot beda!");
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                const n1 = d.chargingSlots[s1] ? d.chargingSlots[s1].plat : "KOSONG";
                const n2 = d.chargingSlots[s2] ? d.chargingSlots[s2].plat : "KOSONG";
                const temp = d.chargingSlots[s1];
                d.chargingSlots[s1] = d.chargingSlots[s2];
                d.chargingSlots[s2] = temp;
                t.update(mainRef, { chargingSlots: d.chargingSlots });
                addLog(admName, "SWAP_SLOT", `Tukar posisi: Slot 0${parseInt(s1)+1} (${n1}) dengan Slot 0${parseInt(s2)+1} (${n2})`);
            });
        };

        window.switchQueue = (idx, dir) => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                let q = d.waitingQueue;
                const target = idx + dir;
                if(target >= 0 && target < q.length) {
                    const p1 = q[idx].plat; const p2 = q[target].plat;
                    const dirTxt = dir === -1 ? "NAIK" : "TURUN";
                    [q[idx], q[target]] = [q[target], q[idx]];
                    t.update(mainRef, { waitingQueue: q });
                    addLog(admName, "GESER_ANTREAN", `Menggeser ${p1} ${dirTxt} bertukar dengan ${p2}`);
                }
            });
        };

        window.delQueue = (p) => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                const d = (await t.get(mainRef)).data();
                const u = d.waitingQueue.find(x => x.plat === p);
                const uname = u ? u.userName : '';
                const newQ = d.waitingQueue.filter(x => x.plat !== p);
                t.update(mainRef, { waitingQueue: newQ });
                addLog(admName, "HAPUS_ANTREAN", `Membuang ${p} (${uname}) dari daftar antrean`);
            });
        };

        window.checkRecovery = async () => {
            const s = await getDoc(snapshotRef);
            if(!s.exists()) return alert("Tidak ada backup.");
            snapshotData = s.data();
            document.getElementById('recList').innerText = `BACKUP: ${snapshotData.backupTime ? snapshotData.backupTime.toDate().toLocaleString('id-ID') : '-'}`;
            document.getElementById('recoveryPanel').style.display = 'block';
        };

        window.executeRestore = () => {
            const admName = getAdminName();
            if(!snapshotData) return;
            runTransaction(db, async(t) => {
                t.set(mainRef, { chargingSlots: snapshotData.chargingSlots || [null,null,null], waitingQueue: snapshotData.waitingQueue || [], lastTicket: snapshotData.lastTicket || 0 });
                addLog(admName, "SISTEM_RESTORE", "Melakukan pemulihan data sistem dari backup terakhir");
            });
            document.getElementById('recoveryPanel').style.display = 'none';
            alert("Data Pulih!");
        };

        window.hardReset = () => {
            const admName = getAdminName();
            runTransaction(db, async(t) => {
                t.set(mainRef, { chargingSlots: [null,null,null], waitingQueue: [], lastTicket: 0 });
                addLog(admName, "SISTEM_WIPE", "DANGER: Melakukan format/hapus seluruh data antrian dan slot");
            });
        };

        // --- SISTEM LOGGING ---
        onSnapshot(query(logRef, orderBy("timestamp", "desc"), limit(20)), (snap) => {
            let h = '';
            snap.forEach(d => {
                const x = d.data();
                h += `<div class="log-line"><span style="color:#64748B;">[${x.timestamp ? x.timestamp.toDate().toLocaleTimeString('id-ID') : '-'}]</span> <span style="color:var(--gold-lux); font-weight:800;">${x.actor}</span>: <span style="color:var(--cyan-glow); font-weight:bold;">${x.action}</span> - <span style="color:white;">${x.details}</span></div>`;
            });
            document.getElementById('termLog').innerHTML = h;
        });

        function addLog(actor, act, det) { 
            addDoc(logRef, { action: act, details: det, actor: actor, timestamp: new Date() }); 
        }
    </script>
</body>
</html>
