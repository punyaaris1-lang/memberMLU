<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU - Scanner Absensi</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-canvas: #F4F7FC; --obsidian: #0A1128; --cyan-glow: #00E5FF;
            --gold-lux: #C5A059; --text-main: #0F172A; --text-muted: #64748B;
            --success-glow: #059669; --warning: #D97706; --danger-glow: #E11D48;
            --electric-blue: #2D63ED; --fresh-teal: #0EA5E9; 
            --border-light: #E2E8F0;
        }
        
        body { 
            margin: 0; padding: 0; background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 160, 89, 0.06), transparent 40%),
                linear-gradient(rgba(10, 17, 40, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 17, 40, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Montserrat', sans-serif; color: var(--text-main);
            overflow-x: hidden; padding-bottom: 100px; -webkit-tap-highlight-color: transparent;
        }
        
        * { box-sizing: border-box; outline: none; }

        /* WATERMARK BACKGROUND LOGO */
        .bg-watermark { position: fixed; bottom: -10%; right: -25%; height: 100vh; opacity: 0.08; transform: scale(1.1) rotate(-15deg); z-index: -2; pointer-events: none; user-select: none; }

        .header-main { padding: 40px 20px 60px; text-align: center; position: relative; z-index: 10;}
        .main-title { font-size: 28px; font-weight: 900; color: var(--obsidian); margin: 0; letter-spacing: -1px; text-transform: uppercase;}
        .sub-tag { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; display: block; }

        .content-area { padding: 0 20px; margin-top: -10px; position: relative; z-index: 10;}
        
        .scan-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); padding: 20px; border-radius: 24px; text-align: center; box-shadow: 0 15px 40px rgba(10,17,40,0.08); border: 1px solid white; margin-bottom: 25px;}
        
        .event-input { width: 100%; padding: 16px; border: 2px dashed var(--gold-lux); background: rgba(255,255,255,0.5); border-radius: 16px; font-family: 'Montserrat'; font-weight: 900; font-size: 15px; text-align: center; color: var(--obsidian); margin-bottom: 15px; text-transform: uppercase; outline: none; transition: 0.3s; box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);}
        .event-input:focus { border-style: solid; background: white; box-shadow: 0 0 15px rgba(197, 160, 89, 0.15); }

        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: none !important; background: white;}
        #reader__dashboard_section_csr span { font-family: 'Montserrat'; font-weight: bold; color: var(--text-main); }
        #reader__dashboard_section_swaplink { display: none; } 
        #reader button { background: var(--obsidian); color: var(--gold-lux); border: none; padding: 12px 20px; border-radius: 12px; font-family: 'Montserrat'; font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 5px 15px rgba(10,17,40,0.2);}
        #reader button:active { transform: scale(0.95); }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px;}
        .list-title { font-size: 16px; font-weight: 900; color: var(--obsidian); text-transform: uppercase;}
        .badge-count { background: var(--obsidian); color: var(--gold-lux); padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 900; box-shadow: 0 5px 15px rgba(10,17,40,0.15);}

        .absen-item { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 18px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; box-shadow: 0 10px 25px rgba(10,17,40,0.04); border: 1px solid white; border-left: 5px solid var(--success-glow); animation: slideIn 0.3s ease-out;}
        @keyframes slideIn { from {opacity:0; transform:translateX(-20px);} to {opacity:1; transform:translateX(0);} }
        .ab-left { display: flex; flex-direction: column; }
        .ab-name { font-size: 15px; font-weight: 900; color: var(--obsidian); margin-bottom: 4px; text-transform: uppercase;}
        .ab-plat { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px;}
        .ab-time { font-size: 10px; color: #94A3B8; font-weight: 700; margin-top: 4px;}
        .ab-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(5,150,105,0.1); color: var(--success-glow); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid rgba(5,150,105,0.2);}

        .back-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 350px; z-index: 1000;}
        .btn-premium-back { background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); border: 1px solid var(--border-light); padding: 16px; border-radius: 50px; font-weight: 800; font-size: 12px; color: var(--obsidian); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 15px 35px rgba(10,17,40,0.1); transition: 0.2s;}
        .btn-premium-back:active { transform: scale(0.95); background: var(--obsidian); color: var(--gold-lux);}

        /* MODAL ALERT GLASSMORPHISM */
        .modal-overlay { position: fixed; inset: 0; background: rgba(10,17,40,0.7); backdrop-filter: blur(8px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px;}
        .modal-box { background: rgba(255,255,255,0.95); width: 100%; max-width: 350px; border-radius: 30px; padding: 30px 25px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3); border: 1px solid white; animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes zoomIn { from {transform:scale(0.8); opacity:0;} to {transform:scale(1); opacity:1;} }
        
        .modal-icon { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid white;}
        .m-sukses { background: rgba(5,150,105,0.1); color: var(--success-glow); box-shadow: 0 10px 25px rgba(5,150,105,0.2); border-color: rgba(5,150,105,0.3);}
        .m-warning { background: rgba(245,158,11,0.1); color: var(--warning); box-shadow: 0 10px 25px rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.3);}
        .m-gagal { background: rgba(225,29,72,0.1); color: var(--danger-glow); box-shadow: 0 10px 25px rgba(225,29,72,0.2); border-color: rgba(225,29,72,0.3);}
        
        .modal-title { font-size: 22px; font-weight: 900; color: var(--obsidian); margin-bottom: 10px; text-transform: uppercase;}
        .modal-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; font-weight: 600;}
        .btn-close-modal { width: 100%; padding: 18px; border: none; border-radius: 16px; font-family: 'Montserrat'; font-weight: 900; font-size: 13px; cursor: pointer; color: white; letter-spacing: 1px; transition: 0.2s;}
        .btn-close-modal:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <img src="logomlumaster.png" class="bg-watermark" alt="" onerror="this.style.display='none'">

    <div class="header-main">
        <h1 class="main-title"><i class="fas fa-qrcode"></i> SCAN ABSENSI</h1>
        <span class="sub-tag">Database Kehadiran Kopdar MLU</span>
    </div>

    <div class="content-area">
        <div class="scan-card">
            <input type="text" id="eventName" class="event-input" placeholder="NAMA ACARA (Cth: KOPDAR MARET)" value="KOPDAR RUTIN MLU">
            <div style="font-size: 10px; color: var(--text-muted); font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px;">Arahkan Kamera ke QR Code Member</div>
            
            <div id="reader"></div>
        </div>

        <div class="list-header">
            <div class="list-title">Riwayat Hadir</div>
            <div class="badge-count" id="totalHadir">0 Orang</div>
        </div>

        <div id="absenListBody">
            <div style="text-align:center; padding:30px; color:#94A3B8; font-size:12px; background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); border-radius:20px; border:1px dashed var(--border-light); font-weight:600;">Belum ada member yang di-scan.</div>
        </div>
    </div>

    <div class="back-nav"><a href="dashboard.html" class="btn-premium-back"><i class="fas fa-arrow-left"></i> KEMBALI KE DASHBOARD</a></div>

    <div class="modal-overlay" id="alertModal">
        <div class="modal-box">
            <div class="modal-icon" id="alertIcon"><i class="fas fa-check"></i></div>
            <div class="modal-title" id="alertTitle">Sukses</div>
            <div class="modal-msg" id="alertMsg">Data absensi berhasil disimpan.</div>
            <button class="btn-close-modal" id="alertBtn" onclick="tutupAlert()">LANJUT SCAN</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // KONEKSI FIREBASE MLU
        const firebaseConfig = { apiKey: "AIzaSyAk3G5aQUBVe_g7_peVu1F6xllP_RejGq0", authDomain: "rtomaka-e67b5.firebaseapp.com", projectId: "rtomaka-e67b5", storageBucket: "rtomaka-e67b5.firebasestorage.app", messagingSenderId: "472036722228", appId: "1:472036722228:web:11d520f9204db317d02c61" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        // PROTEKSI HALAMAN: HANYA PENGURUS
        let uData = null;
        try { uData = JSON.parse(localStorage.getItem('maka_user')); } catch (e) {}
        if (!uData || !uData.plat) window.location.href = 'index.html'; 
        
        const myRole = uData.role ? uData.role.toUpperCase() : "";
        const isAdmin = myRole !== 'MEMBER' && myRole !== 'KELUARGA MLU' && myRole !== 'GUEST' && myRole !== 'NON-MEMBER';
        
        if (!isAdmin && uData.plat.replace(/\s+/g, '').toUpperCase() !== "B4248SWF") {
            alert("AKSES DITOLAK! Halaman ini khusus Pengurus untuk melakukan scan absensi.");
            window.location.href = 'dashboard.html';
        }

        let isScanningPaused = false;
        let html5QrcodeScanner;

        document.addEventListener('DOMContentLoaded', () => {
            // INIT KAMERA SCANNER
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            
            // LOAD DATA ABSEN HARI INI
            loadAbsensiHariIni();
        });

        async function onScanSuccess(decodedText, decodedResult) {
            if (isScanningPaused) return;
            isScanningPaused = true; // Pause scanner biar gak scan dobel

            const eventName = document.getElementById('eventName').value.trim() || "KOPDAR RUTIN MLU";
            const rawId = decodedText.trim(); 
            const cleanPlat = decodedText.replace(/\s+/g, '').toUpperCase(); 

            document.getElementById('alertIcon').className = "modal-icon m-sukses";
            document.getElementById('alertIcon').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            document.getElementById('alertTitle').innerText = "Memproses...";
            document.getElementById('alertMsg').innerText = "Sedang mencari data member...";
            document.getElementById('alertBtn').style.background = "#94A3B8";
            document.getElementById('alertBtn').innerText = "TUNGGU";
            document.getElementById('alertModal').style.display = 'flex';

            try {
                // 1. CEK APAKAH SUDAH ABSEN
                const todayStr = new Date().toLocaleDateString('id-ID');
                const qCek = query(collection(db, "mlu_absensi"), 
                    where("memberId", "==", rawId), 
                    where("event", "==", eventName),
                    where("dateString", "==", todayStr)
                );
                const cekSnap = await getDocs(qCek);
                
                if (!cekSnap.empty) {
                    showModalResult("m-warning", "fa-exclamation-triangle", "SUDAH ABSEN", `Member dengan ID / Plat ini sudah absen untuk acara ini hari ini.`, "var(--warning)");
                    return;
                }

                // 2. CARI NAMA MEMBER
                let namaMember = "MEMBER MLU";
                let platAsli = decodedText;
                
                const qMember = query(collection(db, "mlu_members"));
                const memSnap = await getDocs(qMember);
                memSnap.forEach(doc => {
                    const data = doc.data();
                    if ((data.plat && data.plat.replace(/\s+/g, '').toUpperCase() === cleanPlat) || doc.id === rawId) {
                        namaMember = data.namaKtp || data.namaWa || data.nama;
                        platAsli = data.plat;
                    }
                });

                // 3. SIMPAN ABSEN
                await addDoc(collection(db, "mlu_absensi"), {
                    memberId: rawId,
                    nama: namaMember,
                    plat: platAsli,
                    event: eventName,
                    dateString: todayStr,
                    timestamp: Date.now(),
                    scanBy: uData.namaKtp || uData.namaWa
                });

                showModalResult("m-sukses", "fa-check", "ABSEN BERHASIL", `<b style="color:var(--obsidian); font-size:16px;">${namaMember}</b><br>${platAsli}<br><br>Berhasil hadir di acara ${eventName}.`, "var(--success-glow)");
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); 

            } catch (error) {
                showModalResult("m-gagal", "fa-times", "ERROR", "Terjadi kesalahan sistem: " + error.message, "var(--danger-glow)");
            }
        }

        function onScanFailure(error) {}

        function showModalResult(iconClass, iconFa, title, msg, btnColor) {
            document.getElementById('alertIcon').className = `modal-icon ${iconClass}`;
            document.getElementById('alertIcon').innerHTML = `<i class="fas ${iconFa}"></i>`;
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerHTML = msg;
            document.getElementById('alertBtn').style.background = btnColor;
            document.getElementById('alertBtn').innerText = "LANJUT SCAN BERIKUTNYA";
        }

        window.tutupAlert = () => {
            document.getElementById('alertModal').style.display = 'none';
            setTimeout(() => { isScanningPaused = false; }, 1000);
        };

        function loadAbsensiHariIni() {
            const todayStr = new Date().toLocaleDateString('id-ID');
            
            const qAbsen = query(collection(db, "mlu_absensi"), where("dateString", "==", todayStr));
            onSnapshot(qAbsen, (snap) => {
                const list = document.getElementById('absenListBody');
                let count = 0;
                let htmlStr = '';
                
                let dataArr = [];
                snap.forEach(doc => dataArr.push(doc.data()));
                dataArr.sort((a, b) => b.timestamp - a.timestamp); 

                dataArr.forEach(d => {
                    const timeStr = new Date(d.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                    count++;
                    htmlStr += `
                    <div class="absen-item">
                        <div class="ab-left">
                            <div class="ab-name">${d.nama}</div>
                            <div class="ab-plat"><i class="fas fa-motorcycle"></i> ${d.plat}</div>
                            <div class="ab-time"><i class="fas fa-clock"></i> ${timeStr} WIB • ${d.event}</div>
                        </div>
                        <div class="ab-icon"><i class="fas fa-check-circle"></i></div>
                    </div>`;
                });

                document.getElementById('totalHadir').innerText = `${count} ORANG`;
                
                if (count > 0) {
                    list.innerHTML = htmlStr;
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:30px; color:#94A3B8; font-size:12px; background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); border-radius:20px; border:1px dashed var(--border-light); font-weight:600;">Belum ada member yang absen hari ini.</div>`;
                }
            });
        }
    </script>
</body>
</html>
